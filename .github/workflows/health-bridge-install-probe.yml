name: Health Bridge Android 16 install probe
on:
  pull_request:
    branches: [master]
    paths: ['.github/workflows/health-bridge-install-probe.yml']
permissions:
  contents: read
  actions: read
jobs:
  install-original-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_AVD_HOME: ${{ runner.temp }}/beyond-avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator platforms;android-36 build-tools;35.0.0 system-images;android-36;google_apis;x86_64'
          log-accepted-android-sdk-licenses: 'false'
      - name: Download the exact phone-test artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39262505666
          name: BEYOND-Health-Bridge-test-3d73cdeb7d96532b876fd1cb05099b1b2c226d70
          path: probe/apk
      - name: Verify the original APK
        working-directory: probe/apk
        run: |
          test "$(cat SOURCE_COMMIT.txt)" = "3d73cdeb7d96532b876fd1cb05099b1b2c226d70"
          sha256sum --check SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app-debug.apk
      - name: Boot Android 16
        run: |
          mkdir -p probe/results "$ANDROID_AVD_HOME"
          trap 'tail -n 120 probe/results/emulator.log || true' EXIT
          sudo chmod 666 /dev/kvm
          printf 'no\n' | avdmanager create avd --force --name beyond36 --path "$ANDROID_AVD_HOME/beyond36.avd" --package 'system-images;android-36;google_apis;x86_64'
          avdmanager list avd
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/beyond36.ini"
          "$ANDROID_HOME/emulator/emulator" -avd beyond36 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -cores 2 > probe/results/emulator.log 2>&1 &
          emulator_pid=$!
          sleep 2
          kill -0 "$emulator_pid"
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell getprop ro.build.version.release > probe/results/android-version.txt
      - name: Install and launch the original APK
        run: |
          set -o pipefail
          adb logcat -c
          adb install --no-streaming probe/apk/app-debug.apk 2>&1 | tee probe/results/install.txt
          adb shell am start -W -n app.beyond.healthbridge/.MainActivity | tee probe/results/launch.txt
          sleep 3
          adb shell uiautomator dump /sdcard/bridge-screen.xml
          adb pull /sdcard/bridge-screen.xml probe/results/screen.xml
          adb shell screencap -p /sdcard/bridge.png
          adb pull /sdcard/bridge.png probe/results/screen.png
          python - <<'PY'
          from pathlib import Path
          screen = Path('probe/results/screen.xml').read_text()
          assert 'BEYOND Health Bridge' in screen, screen
          import re, subprocess
          dimensions = subprocess.check_output(['adb', 'shell', 'wm', 'size'], text=True)
          width, height = map(int, re.findall(r'(\d+)x(\d+)', dimensions)[-1])
          for _ in range(2):
              subprocess.run(['adb', 'shell', 'input', 'swipe', str(width//2), str(height*4//5), str(width//2), str(height//5), '350'], check=True)
          subprocess.run(['adb', 'shell', 'uiautomator', 'dump', '/sdcard/bridge-scrolled.xml'], check=True)
          subprocess.run(['adb', 'pull', '/sdcard/bridge-scrolled.xml', 'probe/results/scrolled.xml'], check=True)
          assert 'ALLOW SLEEP ACCESS AND READ' in Path('probe/results/scrolled.xml').read_text()
          subprocess.run(['adb', 'shell', 'screencap', '-p', '/sdcard/bridge-scrolled.png'], check=True)
          subprocess.run(['adb', 'pull', '/sdcard/bridge-scrolled.png', 'probe/results/scrolled.png'], check=True)
          print('Original APK installed and opened on Android 16; no health permission granted')
          PY
      - name: Collect Android logs
        if: always()
        run: |
          mkdir -p probe/results
          timeout 10 adb logcat -d > probe/results/logcat.txt || true
          tail -n 120 probe/results/emulator.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android16-original-apk-install-probe
          path: probe/results
          retention-days: 7
