name: Factory Contract Bootstrap Dispatch

on:
  push:
    branches: [codex/factory-contract-bootstrap-dispatch]

permissions:
  contents: read

jobs:
  dispatch:
    if: github.repository == 'gavinlohnes/neo-beyond-lohnes' && github.actor == 'gavinlohnes'
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.BEYOND_BUILDER_APP_ID }}
          private-key: ${{ secrets.BEYOND_BUILDER_PRIVATE_KEY }}
          owner: gavinlohnes
          repositories: neo-beyond-lohnes
          permission-contents: write
          permission-pull-requests: write
      - name: Create bot-authored bootstrap candidate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: gavinlohnes/neo-beyond-lohnes
          BASELINE: 1fffd0344c24d22c71425d7cb6f971ee39fbc4b6
          SOURCE_SHA: 45339c8b5aa920fdd1521c58aba359d6715605a9
          EXPECTED_CURRENT_HEAD: 61aa4169e2c9aa2253bebc839d58089370b1924b
          TARGET_BRANCH: beyond-builder/factory-contract-bootstrap-001
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_SLUG" = 'beyond-builder'
          login='beyond-builder[bot]'
          test "$(gh api "repos/$REPO/git/ref/heads/master" --jq .object.sha)" = "$BASELINE"
          source_tree="$(gh api "repos/$REPO/git/commits/$SOURCE_SHA" --jq .tree.sha)"
          test "$(gh api "repos/$REPO/git/ref/heads/$TARGET_BRANCH" --jq .object.sha)" = "$EXPECTED_CURRENT_HEAD"
          bot_sha="$(gh api "repos/$REPO/git/commits" --method POST -f message='fix(factory): attest bootstrap review correction' -f tree="$source_tree" -f parents[]="$EXPECTED_CURRENT_HEAD" --jq .sha)"
          gh api "repos/$REPO/git/refs/heads/$TARGET_BRANCH" --method PATCH -f sha="$bot_sha" -F force=false >/dev/null
          test "$(gh api "repos/$REPO/commits/$bot_sha" --jq .author.login)" = "$login"
          pr_url="$(gh api "repos/$REPO/pulls/55" --jq .html_url)"
          test "$(gh api "repos/$REPO/pulls/55" --jq .user.login)" = "$login"
          echo "builder=$login"
          echo "head=$bot_sha"
          echo "pr=$pr_url"
