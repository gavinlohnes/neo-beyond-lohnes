name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      # Harvest Checkpoint 4: the "browser" Vitest project needs Chromium
      # actually present — npm ci alone doesn't fetch Playwright's browser
      # binary. --with-deps also installs the OS-level libraries Chromium
      # needs on a bare Ubuntu runner (Linux-only flag; not needed/valid
      # for local Windows/macOS installs, which is why this step lives
      # only here, not in package.json).
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run
      # NUTRITION-002: optional — falls back to USDA's public rate-limited
      # DEMO_KEY when this secret isn't set. See
      # application/foodLookupQueries.ts's doc comment.
      - run: npm run build
        env:
          VITE_USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
