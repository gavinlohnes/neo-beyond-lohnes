name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # CI-SPEED-001: the full suite always runs before publishing, split into 4 parallel shards.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: tests (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Harvest Checkpoint 4: the "browser" Vitest project needs Chromium and its OS libraries.
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      # NUTRITION-002: optional — falls back to USDA's public rate-limited
      # DEMO_KEY when this secret isn't set. See
      # application/foodLookupQueries.ts's doc comment.
      - run: npm run build
        env:
          VITE_USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
