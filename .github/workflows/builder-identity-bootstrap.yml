name: Builder Candidate Dispatch

on:
  push:
    branches: [codex/autopilot-candidate-dispatch-002-rebuild]

permissions:
  contents: read

concurrency:
  group: builder-candidate-dispatch
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'gavinlohnes/neo-beyond-lohnes' && github.actor == 'gavinlohnes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.BEYOND_BUILDER_APP_ID }}
          private-key: ${{ secrets.BEYOND_BUILDER_PRIVATE_KEY }}
          owner: gavinlohnes
          repositories: neo-beyond-lohnes
          permission-contents: write
          permission-pull-requests: write
      - name: Reconcile or create canonical Builder-App candidate
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_APP_ID: ${{ vars.BEYOND_BUILDER_APP_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.BEYOND_BUILDER_INSTALLATION_ID }}
          ACTUAL_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: node scripts/factory-candidate-dispatch.mjs
