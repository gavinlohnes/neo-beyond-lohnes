name: Builder Identity Bootstrap

on:
  push:
    branches: [codex/factory-autopilot-001-owner-work-reduction]

permissions:
  contents: read

concurrency:
  group: builder-identity-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'gavinlohnes/neo-beyond-lohnes' && github.actor == 'gavinlohnes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.BEYOND_BUILDER_APP_ID }}
          private-key: ${{ secrets.BEYOND_BUILDER_PRIVATE_KEY }}
          owner: gavinlohnes
          repositories: neo-beyond-lohnes
          permission-contents: write
          permission-pull-requests: write
      - name: Create Builder-App replacement candidate
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_APP_ID: ${{ vars.BEYOND_BUILDER_APP_ID }}
          EXPECTED_INSTALLATION_ID: ${{ vars.BEYOND_BUILDER_INSTALLATION_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: node scripts/factory-builder-bootstrap.mjs
