<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>BEYOND · Redesign prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#000; --s1:#070707; --s2:#0f0f0f; --s3:#161616;
  --line:#2a2a2a; --line-2:#3a3a3a;
  --t1:#f2f2f2; --t2:#a8a8a8; --t3:#8c8c8c;
  --red:#D0141B; --red-soft:rgba(208,20,27,.14); --amber:#c8901e; --cta-t:#fff;
  --win:#3a3a3a; --city:#060606; --city-edge:#1c1c1c;
  --display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--t1); font-family:var(--display); font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:40; }
button,input,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:0; padding:0; }
:focus-visible{ outline:2px solid var(--t1); outline-offset:2px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* suit changes with the mode */
body[data-mode="on-shift"]{
  --s1:#030303; --s2:#080808; --s3:#0e0e0e; --line:#1b1b1b; --line-2:#292929;
  --t1:#b6b6b6; --t2:#8a8a8a; --t3:#767676;
  --red:#9f1117; --red-soft:rgba(159,17,23,.16); --cta-t:#e2e2e2; --amber:#a67a1c;
  --win:#5a5a5a; --city:#030303; --city-edge:#191919;
}
body[data-mode="recover"]{ --t2:#9a9a9a; --win:#2e2e2e; }

.app{ max-width:430px; margin:0 auto; min-height:100vh; position:relative; border-left:1px solid #111; border-right:1px solid #111; padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px)); }

/* header */
.hdr{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
.hdr-row{ display:flex; align-items:center; gap:10px; padding:8px 14px; min-height:52px; }
.emblem{ display:flex; align-items:center; gap:9px; min-height:44px; padding-right:6px; letter-spacing:.18em; font-weight:600; font-size:15px; }
.emblem .where{ color:var(--t3); letter-spacing:.12em; font-weight:500; }
.hdr .clock{ margin-left:auto; font-family:var(--mono); font-size:13px; color:var(--t2); }
.backbtn{ display:flex; align-items:center; gap:6px; min-height:44px; padding:0 4px; color:var(--t2); font-size:14px; letter-spacing:.08em; text-transform:uppercase; }
.sample{ display:flex; align-items:center; gap:8px; padding:6px 14px; border-top:1px solid var(--line); background:var(--s1); font-size:12px; color:var(--amber); letter-spacing:.08em; }
.sample button{ margin-left:auto; border:1px solid var(--line-2); color:var(--t1); padding:0 12px; min-height:32px; font-size:12px; letter-spacing:.1em; }

/* layout bits */
.pad{ padding:14px; }
.stack{ display:grid; gap:14px; }
.h{ font-size:12px; letter-spacing:.16em; color:var(--t3); font-weight:500; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
.h::before{ content:"//"; color:var(--line-2); letter-spacing:0; }
h1,h2,h3{ margin:0; font-weight:600; }
.muted{ color:var(--t2); } .small{ font-size:13px; }
.panel{ position:relative; background:linear-gradient(225deg, transparent 9.9px, var(--line) 9.9px, var(--line) 11.1px, var(--s1) 11.1px); border:1px solid var(--line); padding:14px; clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
.panel::before,.panel::after{ content:""; position:absolute; width:10px; height:10px; pointer-events:none; }
.panel::before{ top:0; left:0; border-top:1px solid var(--t3); border-left:1px solid var(--t3); }
.panel::after{ bottom:0; right:0; border-bottom:1px solid var(--t3); border-right:1px solid var(--t3); }

/* mode scene */
.mode{ position:relative; overflow:hidden; padding:16px 16px 0; border-bottom:1px solid var(--line);
  --rt:var(--t3);
  background:
    linear-gradient(var(--rt),var(--rt)) left 6px top 6px/12px 1px no-repeat,
    linear-gradient(var(--rt),var(--rt)) left 6px top 6px/1px 12px no-repeat,
    linear-gradient(var(--rt),var(--rt)) right 6px top 6px/12px 1px no-repeat,
    linear-gradient(var(--rt),var(--rt)) right 6px top 6px/1px 12px no-repeat; }
.mode > *{ position:relative; z-index:1; }
.mode .scene{ height:56px; }
.mode .sky{ position:absolute; z-index:0; inset:0; pointer-events:none; transition:opacity .6s var(--ease);
  background:radial-gradient(140% 90% at 50% 100%, rgba(150,10,16,.55) 0%, rgba(90,5,9,.3) 38%, rgba(40,2,4,.1) 62%, transparent 80%); }
.mode .beam{ position:absolute; z-index:0; left:calc(28% - 36px); bottom:0; width:72px; height:250px; transform-origin:50% 100%; transform:rotate(-8deg); pointer-events:none;
  background:linear-gradient(to top, rgba(255,236,220,.2), rgba(255,236,220,.06) 60%, rgba(255,236,220,0)); clip-path:polygon(47% 100%, 53% 100%, 100% 0, 0 0); filter:blur(1.5px); animation:beam 11s ease-in-out infinite alternate; }
@keyframes beam{ from{ transform:rotate(-24deg); } to{ transform:rotate(16deg); } }
.mode .skyline{ position:absolute; z-index:0; left:0; right:0; bottom:0; width:100%; height:78px; pointer-events:none; }
.skyline .city{ fill:var(--city); stroke:var(--city-edge); }
.skyline .ant{ stroke:var(--city-edge); }
.skyline .w{ fill:var(--win); }
.mode .scan{ display:none; position:absolute; z-index:0; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
body[data-mode="on-shift"] .mode .scan{ display:block; }
.mode .sweep{ position:absolute; z-index:2; top:0; bottom:0; left:0; width:2px; background:var(--red); box-shadow:0 0 14px 2px rgba(208,20,27,.55); opacity:0; pointer-events:none; }
.mode .sweep.go{ animation:sweep .5s var(--ease) forwards; }
@keyframes sweep{ 0%{ left:0; opacity:1; } 85%{ opacity:1; } 100%{ left:100%; opacity:0; } }
.mode-btn{ width:100%; text-align:left; display:flex; align-items:baseline; gap:12px; min-height:52px; }
.mode-name{ font-size:34px; line-height:1; letter-spacing:.1em; font-weight:700; }
.mode-chev{ margin-left:auto; align-self:center; color:var(--t2); font-size:13px; letter-spacing:.12em; border:1px solid var(--line-2); padding:6px 10px; background:var(--bg); }
.mode-meta{ font-size:13px; color:var(--t2); }
.mode-meta .pin{ color:var(--t1); }
.timeline{ margin-top:12px; }
.tl-bar{ position:relative; display:flex; height:10px; gap:2px; }
.tl-seg{ height:100%; background:var(--s3); border:1px solid var(--line); }
.tl-seg.on{ background:var(--t2); border-color:var(--t2); }
.tl-now{ position:absolute; top:-5px; width:3px; height:20px; background:var(--t1); box-shadow:0 0 0 2px var(--bg); transform:translateX(-1px); }
.tl-ruler{ position:relative; height:6px; margin-top:3px; }
.tl-ruler i{ position:absolute; top:0; width:1px; height:3px; background:var(--line-2); }
.tl-ruler i.maj{ height:6px; background:var(--t3); }
.tl-legend{ position:relative; height:14px; margin-top:6px; font-family:var(--mono); font-size:11px; color:var(--t3); }
.tl-legend span{ position:absolute; top:0; transform:translateX(-50%); text-shadow:0 0 3px #000, 0 0 6px #000; }
.tl-legend span:first-child{ transform:none; } .tl-legend span:last-child{ transform:translateX(-100%); }

/* log row */
.actions{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.act{ min-height:58px; border:1px solid var(--line-2); display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; letter-spacing:.12em; font-size:15px;
  --bd:var(--line-2); --fill:var(--s2); background:linear-gradient(225deg, transparent 7.07px, var(--bd) 7.07px, var(--bd) 8.3px, var(--fill) 8.3px); clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
.act:active{ --fill:var(--s3); }

/* next card */
.next h2{ font-size:22px; letter-spacing:.02em; }
.next p{ margin:6px 0 12px; color:var(--t2); font-size:14px; }
.next p:last-child{ margin-bottom:0; }
.cta{ display:flex; align-items:center; justify-content:space-between; width:100%; min-height:48px; padding:0 16px; background:var(--red); color:var(--cta-t); font-weight:600; letter-spacing:.14em; font-size:15px; clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
.cta:focus-visible,.act:focus-visible,.prim:focus-visible{ outline-offset:-5px; }
.prim{ display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; padding:0 16px; border:1px solid var(--t1); color:var(--t1); font-weight:600; letter-spacing:.14em; font-size:15px; background:var(--s2); }
.prim[disabled]{ opacity:.4; cursor:default; }
.ghost{ display:flex; align-items:center; justify-content:center; min-height:44px; padding:0 14px; border:1px solid var(--line-2); letter-spacing:.1em; font-size:13px; font-weight:500; }
.textbtn{ min-height:44px; padding:0 4px; color:var(--t2); letter-spacing:.1em; font-size:13px; text-decoration:underline; text-underline-offset:4px; }
.why{ margin-top:10px; font-size:13px; color:var(--t2); }
.why summary{ min-height:36px; display:flex; align-items:center; cursor:pointer; letter-spacing:.06em; }
.pair{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

/* numbers */
.nums{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
.nums button{ background:var(--s1); padding:10px 8px 9px; text-align:left; min-height:74px; display:flex; flex-direction:column; justify-content:space-between; }
.nums.two{ grid-template-columns:1fr 1fr; }
.num{ font-family:var(--mono); font-weight:600; font-size:18px; letter-spacing:-.02em; }
.num small{ font-size:11px; color:var(--t3); font-weight:400; }
.flab{ font-size:11px; letter-spacing:.12em; color:var(--t3); }
.bar{ height:3px; background:var(--s3); margin-top:6px; }
.bar i{ display:block; height:100%; background:var(--t2); }
.hint{ font-size:12px; color:var(--t3); margin-top:8px; }

/* rows */
.rows{ border-top:1px solid var(--line); }
.row{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; min-height:58px; padding:10px 14px; border-bottom:1px solid var(--line); }
.row .txt{ flex:1; min-width:0; }
.row .t,.row .d{ display:block; }
.row .t{ font-size:16px; font-weight:600; letter-spacing:.02em; }
.row .d{ font-size:13px; color:var(--t2); }
.row .go{ color:var(--t3); font-size:18px; }
.row .val{ font-family:var(--mono); font-size:14px; text-align:right; white-space:nowrap; }
.row.static{ cursor:default; }
.tagnew{ font-size:10px; letter-spacing:.14em; border:1px solid var(--t2); color:var(--t1); padding:2px 5px; margin-left:6px; vertical-align:2px; }
.group-h{ padding:18px 14px 6px; font-size:12px; letter-spacing:.16em; color:var(--t3); display:flex; gap:8px; }
.group-h::before{ content:"//"; color:var(--line-2); }

/* segmented */
.seg{ display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line-2); }
.seg button{ min-height:46px; font-size:13px; letter-spacing:.14em; color:var(--t2); font-weight:600; }
.seg button + button{ border-left:1px solid var(--line-2); }
.seg button[aria-selected="true"]{ background:var(--t1); color:#000; }

/* cards in progress */
.card{ display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--s1); padding:14px; }
.card .big{ font-family:var(--mono); font-size:28px; font-weight:600; letter-spacing:-.02em; }
.spark{ width:100%; height:56px; display:block; margin-top:8px; }
.bars{ display:flex; align-items:flex-end; gap:6px; height:44px; margin-top:10px; }
.bars i{ flex:1; background:var(--line-2); }
.bars i.on{ background:var(--t2); }

/* nav */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bg); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
.nav-in{ max-width:430px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); }
.nav button{ position:relative; min-height:var(--nav-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; font-size:11px; letter-spacing:.14em; color:var(--t3); font-weight:500; }
.nav button[aria-current="page"]{ color:var(--t1); background:var(--s1); }
.nav button[aria-current="page"]::before{ content:""; position:absolute; top:0; left:22%; right:22%; height:2px; background:var(--red); }

/* search */
.search{ display:flex; align-items:center; gap:10px; border:1px solid var(--line-2); background:var(--s1); padding:0 12px; min-height:50px; }
.search input{ flex:1; background:none; border:0; outline:none; font-size:16px; min-height:46px; min-width:0; }
.search input::-webkit-search-cancel-button{ -webkit-appearance:none; display:none; }
.search:focus-within{ border-color:var(--t1); }
.clear{ min-width:44px; min-height:44px; color:var(--t2); }
.empty{ padding:20px 14px; color:var(--t2); }

/* sheets */
.scrim{ position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.72); display:flex; align-items:flex-end; justify-content:center; }
.sheet{ width:100%; max-width:430px; max-height:88vh; overflow:auto; background:var(--s1); border-top:1px solid var(--line-2); padding:4px 0 calc(16px + env(safe-area-inset-bottom,0px)); animation:up .22s var(--ease); }
@keyframes up{ from{ transform:translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }
.sheet-h{ display:flex; align-items:center; gap:8px; padding:8px 14px 6px; }
.sheet-h h2{ font-size:20px; letter-spacing:.1em; }
.sheet-h .sback{ min-height:44px; padding-right:6px; color:var(--t2); font-size:14px; letter-spacing:.08em; display:flex; align-items:center; gap:4px; }
.x{ margin-left:auto; min-width:44px; min-height:44px; color:var(--t2); font-size:22px; }
.sbody{ padding:4px 14px 6px; display:grid; gap:12px; }
.opt{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; min-height:60px; padding:10px 14px; border-top:1px solid var(--line); }
.opt[aria-pressed="true"]{ background:var(--red-soft); }
.opt .t{ font-weight:600; letter-spacing:.04em; font-size:17px; display:block; }
.opt .d{ font-size:13px; color:var(--t2); display:block; }
.tag{ margin-left:auto; font-size:11px; letter-spacing:.12em; color:var(--t2); border:1px solid var(--line-2); padding:3px 7px; white-space:nowrap; }
.amounts{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.amounts button{ min-height:64px; border:1px solid var(--line-2); background:var(--s2); font-family:var(--mono); font-weight:600; font-size:18px; }
.note{ font-size:13px; color:var(--t2); margin:0; }
.mealrow{ display:flex; align-items:stretch; border-top:1px solid var(--line); }
.mealrow .open{ flex:1; text-align:left; padding:10px 14px; min-height:60px; }
.mealrow .open .t{ font-weight:600; font-size:16px; display:block; }
.mealrow .open .d{ font-size:13px; color:var(--t2); font-family:var(--mono); display:block; }
.mealrow .quick{ min-width:76px; border-left:1px solid var(--line); font-weight:600; letter-spacing:.14em; font-size:13px; }
.newrow{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; min-height:56px; padding:10px 14px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-weight:600; letter-spacing:.04em; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ min-height:44px; min-width:52px; padding:0 12px; border:1px solid var(--line-2); font-family:var(--mono); font-size:15px; }
.chip[aria-pressed="true"]{ border-color:var(--t1); background:var(--s3); color:var(--t1); }
.check{ display:flex; align-items:center; gap:12px; min-height:48px; cursor:pointer; font-size:15px; }
.check input{ width:22px; height:22px; accent-color:#f2f2f2; }
.scale{ display:grid; gap:6px; }
.scale .top{ display:flex; justify-content:space-between; font-size:14px; font-weight:600; letter-spacing:.04em; }
.scale .ends{ display:flex; justify-content:space-between; font-size:12px; color:var(--t3); }
.scale .pts{ display:grid; gap:6px; }
.scale .pts button{ min-height:44px; border:1px solid var(--line-2); font-family:var(--mono); font-size:15px; }
.scale .pts button[aria-pressed="true"]{ border-color:var(--t1); background:var(--t1); color:#000; }

/* forms */
.field{ display:grid; gap:6px; }
.field label{ font-size:12px; letter-spacing:.12em; color:var(--t3); }
.field input,.field textarea{ background:var(--s2); border:1px solid var(--line-2); padding:12px; min-height:48px; font-size:16px; width:100%; }
.field textarea{ min-height:90px; resize:vertical; }
.field input:focus,.field textarea:focus{ outline:none; border-color:var(--t1); }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
details.more summary{ min-height:40px; display:flex; align-items:center; color:var(--t2); font-size:13px; letter-spacing:.08em; cursor:pointer; }

/* workout */
.step{ display:grid; grid-template-columns:52px 1fr 52px; gap:8px; align-items:center; }
.step button{ min-height:52px; border:1px solid var(--line-2); font-size:22px; }
.step .v{ text-align:center; font-family:var(--mono); font-size:24px; font-weight:600; border:1px solid var(--line); min-height:52px; display:flex; align-items:center; justify-content:center; }
.step .v{ cursor:text; gap:4px; }
.step .v:focus-within{ border-color:var(--t1); }
.step .v small{ font-size:12px; color:var(--t3); }
.vin{ width:5.5ch; background:none; border:0; outline:none; text-align:right; font-family:var(--mono); font-size:24px; font-weight:600; color:var(--t1); padding:0; }
.vin::placeholder{ color:var(--t3); }
.lastbest{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); margin:10px 0; }
.lastbest div{ background:var(--s1); padding:8px 10px; }
.sets{ display:flex; gap:6px; margin-top:8px; }
.sets span{ flex:1; text-align:center; font-family:var(--mono); font-size:13px; border:1px solid var(--line); padding:6px 0; color:var(--t2); }
.sets span.done{ border-color:var(--t2); color:var(--t1); }

/* history */
.hist-num{ font-family:var(--mono); font-size:44px; font-weight:600; letter-spacing:-.03em; line-height:1; }
.chart{ width:100%; height:auto; display:block; margin-top:10px; color:var(--t1); }
.entry{ display:flex; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px; }
.entry span:last-child{ font-family:var(--mono); }
.notice{ border:1px dashed var(--line-2); padding:12px; font-size:13px; color:var(--t2); }

/* toast */
.toast{ position:fixed; left:50%; bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:95; width:calc(100% - 28px); max-width:402px; background:var(--s2); border:1px solid var(--line-2); display:flex; align-items:center; gap:10px; padding:6px 6px 6px 14px; font-size:14px; }
.toast button{ margin-left:auto; min-height:44px; padding:0 14px; border:1px solid var(--line-2); letter-spacing:.12em; font-size:13px; }

@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
@media (min-width:700px){ .app{ margin-top:16px; border:1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <header class="hdr" id="hdr"></header>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="nav" aria-label="Primary"><div class="nav-in" id="nav"></div></nav>
<div id="layer"></div>
<div id="live" class="sr" aria-live="polite"></div>

<script>
(function(){
"use strict";
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- sample data (illustrative only) ---------- */

const RULER = Array.from({length:24}, (_, i) => { const f=(i+.5)/24, h=(17+i)%24; return `<i class="${h===18||h===6?"maj":""}" style="left:${(f*100).toFixed(2)}%"></i>`; }).join("");
const CITY = (() => {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let x = 0, d = "M0 92", ants = ""; const wins = [];
  while (x < 400){
    const w = 10 + Math.round(rnd()*22), h = 18 + Math.round(Math.pow(rnd(),1.6)*62);
    const tp = 92 - h, cut = rnd() > .7 ? Math.min(8, w/2) : 0;
    d += ` L${x} ${tp+cut} L${x+cut} ${tp} L${x+w} ${tp}`;
    if (h > 62 && rnd() > .4) ants += `<path d="M${x+w/2} ${tp} V${tp-10}"/>`;
    for (let wy = tp+cut+6; wy < 88; wy += 6) for (let wx = x+3; wx < x+w-3; wx += 5) wins.push([wx,wy]);
    x += w; d += ` L${x} ${92-(8+Math.round(rnd()*10))}`;
  }
  for (let i = wins.length-1; i > 0; i--){ const j = Math.floor(rnd()*(i+1)); [wins[i],wins[j]] = [wins[j],wins[i]]; }
  return { d: d + " L400 92 Z", ants, wins };
})();
function skyline(){
  const n = Math.round(CITY.wins.length * sc().lit * .35);
  const lit = CITY.wins.slice(0,n).map(([x,y]) => `<rect class="w" x="${x}" y="${y}" width="1.6" height="2"/>`).join("");
  return `<svg class="skyline" viewBox="0 0 400 92" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path class="city" d="${CITY.d}" stroke-width="1" vector-effect="non-scaling-stroke"/><g class="ant" stroke-width="1">${CITY.ants}</g>${lit}</svg>`;
}

  return `<div class="pad stack"><h1 style="font-size:24px">${e.n}</h1>
    <div class="lastbest" style="margin:0"><div><span class="flab">LAST TIME</span><div class="num">${e.last}</div></div><div><span class="flab">BEST · ${e.bestDate.toUpperCase()}</span><div class="num">${e.best}</div></div></div>

/* ---------- BODY: numbers, progress, history ---------- */

        <svg class="spark" viewBox="0 0 300 56" preserveAspectRatio="none" aria-hidden="true"><path d="${sp}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg></button>
      <button class="card" data-act="toRecords" data-key="p-t"><span class="flab">TRAINING</span><div class="big">3<small style="font-size:14px;color:var(--t3)"> sessions this week</small></div><span class="small muted">2 new bests this week · opens RECORDS</span>
        <div class="bars" aria-hidden="true"><i style="height:50%"></i><i style="height:75%"></i><i style="height:60%"></i><i class="on" style="height:85%"></i></div></button>
      <button class="row" style="border:1px solid var(--line)" data-act="dest" data-name="Photos & measurements" data-key="p-pm"><span class="txt"><span class="t">Photos & measurements</span><span class="d">Last photo Oct 4 · waist 36.5 in</span></span><span class="go">›</span></button>
    </div></section>

}
function renderDay(v){

function renderHist(v){
  const s = SERIES[v.m], pts = s.pts;
  const min=Math.min(...pts), max=Math.max(...pts), W=360,H=140,p=10;
  const x=i=>p+i*(W-2*p)/(pts.length-1), y=q=>H-p-(q-min)/((max-min)||1)*(H-2*p);
  const d=pts.map((q,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(q).toFixed(1)).join(" ");
  const avg=pts.reduce((a,b)=>a+b,0)/pts.length;
  return `<div class="pad"><p class="h">${s.title.toUpperCase()}</p>
    <div class="hist-num">${s.cur}<span style="font-size:16px;color:var(--t3)"> ${s.unit}</span></div>
    <p class="small muted" style="margin:6px 0 0">${pts.length}-day average ${s.fmt(avg)} · high ${s.fmt(max)} · low ${s.fmt(min)}</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.title}, sample data"><line x1="${p}" x2="${W-p}" y1="${y(avg).toFixed(1)}" y2="${y(avg).toFixed(1)}" stroke="#3a3a3a" stroke-dasharray="3 4"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(pts[pts.length-1]).toFixed(1)}" r="3.5" fill="var(--red)"/></svg>
    <div style="margin-top:12px">${pts.slice(-6).reverse().map((q,i)=>`<div class="entry"><span>${i===0?"Today":DAYS[i]?DAYS[i].d:(i+"d ago")}</span><span>${s.fmt(q)}</span></div>`).join("")}</div></div>`;

/* ---------- COMMAND ---------- */
function cmdMatches(q){
  const w = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hit = t => w.every(x => t.toLowerCase().includes(x));
  return {
    screens: COMMAND.filter(e => hit(e.label+" "+e.a+" "+e.g)),
    logs: LOGS.filter(l => hit("log "+l.label+" "+l.d)),
    meals: MEALS.filter(m => hit(m.n)),
    ex: EX.filter(e => hit(e.n))
  };
}
function cmdResults(){
  if (!S.query.trim()){
    const groups = [...new Set(COMMAND.map(e=>e.g))];
    return groups.map(g => `<div class="group-h">${g.toUpperCase()}</div>` + COMMAND.filter(e=>e.g===g).map(e => `<button class="row" data-act="cmd" data-i="${COMMAND.indexOf(e)}"><span class="txt"><span class="t">${e.label}</span><span class="d">${e.d}</span></span><span class="go">›</span></button>`).join("")).join("");
  }
  const r = cmdMatches(S.query); let out = "";
  if (r.logs.length) out += `<div class="group-h">LOG</div>` + r.logs.map(l => `<button class="row" data-act="sheet" data-s="${l.k}"><span class="txt"><span class="t">Log ${l.label.toLowerCase()}</span><span class="d">${l.d}</span></span><span class="go">›</span></button>`).join("");
  if (r.screens.length) out += `<div class="group-h">SCREENS</div>` + r.screens.map(e => `<button class="row" data-act="cmd" data-i="${COMMAND.indexOf(e)}"><span class="txt"><span class="t">${e.label}</span><span class="d">${e.g} · ${e.d}</span></span><span class="go">›</span></button>`).join("");
  if (r.meals.length || r.ex.length) out += `<div class="group-h">YOUR RECORDS</div>` +
    r.meals.map(m => `<button class="row" data-act="mealLogDirect" data-id="${m.id}"><span class="txt"><span class="t">${m.n}</span><span class="d">Meal · ${m.p} g · ${m.k} kcal · tap to log</span></span><span class="go">›</span></button>`).join("") +
    r.ex.map(e => `<button class="row" data-act="exHistTab" data-i="${EX.indexOf(e)}"><span class="txt"><span class="t">${e.n}</span><span class="d">Exercise · best ${e.best}</span></span><span class="go">›</span></button>`).join("");
  return out || `<div class="empty">Nothing called “${esc(S.query)}”. Try water, chicken, backup or schedule.</div>`;
}
function renderCommand(){
  return `<div class="pad" style="padding-bottom:4px"><label class="search">${I.command}<span class="sr">Search everything</span>
      <input id="q" type="search" placeholder="Search screens, meals, exercises" autocomplete="off" value="${esc(S.query)}" data-key="q" enterkeyhint="go">

}
function renderDest(v){

    <div class="notice">Existing screen, unchanged. In the app this opens the current ${esc(v.title)} view. Back returns you to where you were.</div></div>`;
}

/* ---------- sheets ---------- */
function likelyMeals(){ return MEALS.filter(m => m.when.includes(S.scenario)).slice(0,4); }
function mealList(list){

function mealResults(){

  const list = MEALS.filter(m => m.n.toLowerCase().includes(q.toLowerCase()));

    `<button class="newrow" data-act="mealNew" data-name="${esc(q)}">${I.plus}<span>New meal “${esc(q)}”</span></button>`;

function renderLayer(focusFirst, inPlace){
  const L = layer(); const el = $("#layer");
  if (!L){ el.innerHTML = ""; return; }
  const cur = el.querySelector(".sheet");
  if (inPlace && cur){
    /* update the open sheet in place: no slide-in replay, no flash */
    const tmp = document.createElement("div"); tmp.innerHTML = sheetHTML(L);
    const st = inPlace === "fresh" ? 0 : cur.scrollTop;
    cur.innerHTML = tmp.querySelector(".sheet").innerHTML; cur.scrollTop = st;
  } else el.innerHTML = sheetHTML(L);
  if (focusFirst !== false){
    const f = el.querySelector('[aria-pressed="true"]') || el.querySelector(".sheet input:not([type=checkbox]), .sheet .sbody button, .sheet .opt, .sheet .mealrow button") || el.querySelector(".x");
    f && f.focus({preventScroll:true});
  }
}

function render(opts){
  const m0 = mode();
  if (S.lastMode && m0 !== S.lastMode && S.tab === "TODAY" && !top() && !RM){ S.sweep = true; setTimeout(()=>{ S.sweep = false; }, 700); }
  S.lastMode = m0;
  document.body.dataset.mode = m0.toLowerCase().replace(/\s+/g,"-");
  const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  renderHeader(); renderNav();
  const t = top(); let html;
  if (t){
    html = t.kind==="hist" ? renderHist(t) : t.kind==="workout" ? renderWorkout() : t.kind==="session" ? renderSession(t) : t.kind==="exhist" ? renderExHist(t) : t.kind==="day" ? renderDay(t) : renderDest(t);
  } else html = S.tab==="TODAY" ? renderToday() : S.tab==="TRAIN" ? renderTrain() : S.tab==="BODY" ? renderBody() : renderCommand();
  $("#main").innerHTML = html;
  if (opts && opts.focusMain){ const h = $("#main h1") || $("#main"); h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
  else if (key && !layer()){ const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`); el && el.focus({preventScroll:true}); }
  if (opts && typeof opts.scroll === "number") window.scrollTo(0, opts.scroll);
}
function push(view){ view.scroll = window.scrollY; view.returnKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null; S.stacks[S.tab].push(view); render({ focusMain:true, scroll:0 }); }
function back(){ const v = S.stacks[S.tab].pop(); render({ scroll: v ? v.scroll : 0 }); if (v && v.returnKey){ const el = document.querySelector(`[data-key="${CSS.escape(v.returnKey)}"]`); el && el.focus({preventScroll:true}); } }
function goTab(t){ if (S.tab === t){ S.stacks[t] = []; render({scroll:0}); return; } S.tab = t; render({scroll:0}); announce(t); }
function openSheet(type, extra){ S.lastFocus.push(document.activeElement); S.layers = [Object.assign({type}, extra||{})]; renderLayer(); }
function pushSheet(type, extra){ S.layers.push(Object.assign({type}, extra||{})); renderLayer(true, "fresh"); }
function swapSheet(type){ S.layers = [{type}]; renderLayer(true, "fresh"); }
function closeSheets(){ S.layers = []; S.mealQ = ""; renderLayer(); const f = S.lastFocus.pop(); if (f && document.body.contains(f)) f.focus({preventScroll:true}); else { const k = f && f.dataset && f.dataset.key; const el = k && document.querySelector(`[data-key="${CSS.escape(k)}"]`); el && el.focus({preventScroll:true}); } S.lastFocus = []; }
function announce(m){ $("#live").textContent = m; }
function toast(msg, undo){
  clearTimeout(S.toastTimer); document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status");
  t.innerHTML = `<span>${esc(msg)}</span>${undo?'<button data-act="undo">UNDO</button>':""}`;
  document.body.appendChild(t); S.undo = undo || null;
  S.toastTimer = setTimeout(()=>{ t.remove(); S.undo = null; }, 5000);
}
function logMeal(m, sv){
  sv = sv || 1; const p = Math.round(m.p*sv), k = Math.round(m.k*sv);
  S.protein += p; S.kcal += k; closeSheets(); render();
  toast(`Logged. +${p} g protein.`, () => { S.protein -= p; S.kcal -= k; render(); });
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const d = b.dataset, act = d.act;
  if (act === "scrim"){ if (ev.target === b) closeSheets(); return; }
  switch (act){
    case "home": S.tab = "TODAY"; S.stacks.TODAY = []; render({scroll:0}); break;
    case "back": back(); break;
    case "tab": if (layer()) closeSheets(); goTab(d.tab); break;
    case "demo": openSheet("demo"); break;
    case "scenario": S.scenario = d.id; S.layers = []; renderLayer(); S.tab = "TODAY"; S.stacks.TODAY = []; render({scroll:0}); announce("Mode " + mode()); break;
    case "openMode": openSheet("mode"); break;
    case "follow": S.pin = null; closeSheets(); render(); break;
    case "pin": S.pin = d.mode; closeSheets(); render(); announce("Mode " + mode() + ", pinned"); break;
    case "sheet": if (layer()) { S.layers = []; } openSheet(d.s); break;
    case "sheetPush": pushSheet(d.s); break;
    case "sheetSwap": swapSheet(d.s); break;
    case "sheetBack": S.layers.pop(); renderLayer(true, "fresh"); break;
    case "close": closeSheets(); break;
    case "addWater": { const n = +d.n; S.water += n; S.lastWater = n; closeSheets(); render(); toast(`+${n} oz. ${S.water} oz today.`, () => { S.water -= n; render(); }); break; }
    case "mealLog": logMeal(MEALS.find(m=>m.id===d.id), d.sv ? +d.sv : 1); break;
    case "mealLogDirect": openSheet("portion", { id:d.id, sv:1 }); break;
    case "mealPortion": pushSheet("portion", { id:d.id, sv:1 }); break;
    case "setSv": layer().sv = +d.v; renderLayer(false, true); document.querySelector(`.chip[aria-pressed="true"]`)?.focus(); break;
    case "mealNew": S.newMeal = { n: d.name || S.mealQ || "", save:false }; pushSheet("newmeal"); break;
    case "newMealLog": {
      const n = $("#nm-n").value.trim(), k = +($("#nm-k").value||0), p = +($("#nm-p").value||0), save = $("#nm-save").checked;
      if (!n){ $("#nm-n").focus(); toast("Give it a name."); break; }
      if (save) MEALS.unshift({ id:"u"+Date.now(), n, p, k, when:[S.scenario] });
      S.protein += p; S.kcal += k; closeSheets(); render();
      toast(save ? `Logged and saved. +${p} g protein.` : `Logged. +${p} g protein.`, () => { S.protein -= p; S.kcal -= k; render(); });
      break; }
    case "quickLog": { const k = +($("#qa-k").value||0), p = +($("#qa-p").value||0); S.protein += p; S.kcal += k; closeSheets(); render(); toast(`Logged. +${p} g protein.`, () => { S.protein -= p; S.kcal -= k; render(); }); break; }
    case "logGeneric": closeSheets(); render(); toast(`${d.n} logged.`, () => {}); break;
    case "pressOne": b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x===b?"true":"false")); break;
    case "ci": S.ci[d.k] = +d.v; renderLayer(false, true); document.querySelector(`[data-act="ci"][data-k="${d.k}"][data-v="${d.v}"]`)?.focus(); break;
    case "ciSubmit": S.checked = true; S.ci = {}; closeSheets(); render(); toast("Checked in.", () => { S.checked = false; render(); }); break;
    case "allgood": S.checked = true; render(); toast("Checked in: all good.", () => { S.checked = false; render(); }); break;
    case "hist": if (layer()) closeSheets(); push({ kind:"hist", m:d.m, title:SERIES[d.m].title }); break;
    case "dest": push({ kind:"dest", title:d.name }); break;
    case "cmd": push({ kind:"dest", title:COMMAND[+d.i].label }); break;
    case "clearQ": S.query = ""; render(); $("#q").focus(); break;
    case "trainTab": S.train = d.v; render(); document.querySelector(`[data-key="seg-${d.v}"]`)?.focus(); break;
    case "startWk": { if (!S.wk){ const e = EX[WORKOUT_A[0]]; S.wk = { ex:0, done:0, lb:e.next[0], reps:e.next[1], log:[] }; } push({ kind:"workout", title:"Workout A" }); break; }
    case "finishWk": S.wk = null; S.stacks.TRAIN = []; render({scroll:0}); toast("Workout finished. The app keeps its hold-to-confirm COMPLETE / PARTIAL."); break;
    case "adj": S.wk[d.f] = Math.max(0, S.wk[d.f] + (+d.d)); render(); break;
    case "logSet": { const w = S.wk; w.log.push(`${w.lb}×${w.reps}`); w.done++; render(); toast(`Set logged · ${w.lb} × ${w.reps}`, () => { w.log.pop(); w.done--; render(); }); break; }
    case "nextEx": { const w = S.wk; w.ex++; w.done = 0; w.log = []; const e = EX[WORKOUT_A[w.ex]]; w.lb = e.next[0]; w.reps = e.next[1]; render({scroll:0}); break; }
    case "session": push({ kind:"session", i:+d.i, title:SESSIONS[+d.i].w }); break;
    case "exHist": push({ kind:"exhist", i:+d.i, title:EX[+d.i].n }); break;
    case "exHistTab": S.tab = "TRAIN"; S.train = "RECORDS"; S.stacks.TRAIN = []; push({ kind:"exhist", i:+d.i, title:EX[+d.i].n }); break;
    case "toRecords": S.tab = "TRAIN"; S.train = "RECORDS"; S.stacks.TRAIN = []; render({scroll:0}); break;
    case "day": push({ kind:"day", i:+d.i, title:DAYS[+d.i].d }); break;
    case "toast": toast(d.msg); break;
    case "undo": { const u = S.undo; document.querySelector(".toast")?.remove(); S.undo = null; u && u(); announce("Undone"); break; }
  }
});
document.addEventListener("input", ev => {
  const id = ev.target.id;
  if (id === "q"){ S.query = ev.target.value; $("#results").innerHTML = cmdResults();
    const c = document.querySelector(".search .clear"); if (!c && S.query) ev.target.insertAdjacentHTML("afterend", '<button class="clear" data-act="clearQ" aria-label="Clear search">✕</button>'); else if (c && !S.query) c.remove(); }
  if (id === "mq"){ S.mealQ = ev.target.value; $("#mealres").innerHTML = mealResults(); }
  if (ev.target.dataset.nm){ S.newMeal = S.newMeal || {}; S.newMeal[ev.target.dataset.nm] = ev.target.value; }
  if (ev.target.dataset.wk && S.wk){ const v = parseFloat(ev.target.value); if (!isNaN(v)) S.wk[ev.target.dataset.wk] = v; }
});
/* tap a weight or reps field: it clears, showing the old value as a hint; leave it empty and the old value comes back */
document.addEventListener("focusin", ev => { const t = ev.target; if (t.classList && t.classList.contains("vin")){ t.dataset.prev = t.value; t.placeholder = t.value; t.value = ""; } });
document.addEventListener("focusout", ev => { const t = ev.target; if (t.classList && t.classList.contains("vin") && t.value.trim() === "") t.value = t.dataset.prev || ""; });
document.addEventListener("change", ev => { if (ev.target.id === "nm-save"){ S.newMeal = S.newMeal || {}; S.newMeal.save = ev.target.checked; } });
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.classList && ev.target.classList.contains("vin")){ ev.preventDefault(); ev.target.blur(); return; }
  if (ev.key === "Escape"){ if (layer()){ ev.preventDefault(); if (S.layers.length > 1){ S.layers.pop(); renderLayer(true, "fresh"); } else closeSheets(); } else if (top()){ ev.preventDefault(); back(); } }
  if (ev.key === "Enter" && ev.target.id === "mq"){ ev.preventDefault(); const q = S.mealQ.trim(); if (!q) return; const m = MEALS.find(x => x.n.toLowerCase().includes(q.toLowerCase())); if (m) pushSheet("portion", { id:m.id, sv:1 }); else { S.newMeal = { n:q, save:false }; pushSheet("newmeal"); } }
  if (ev.key === "Tab" && layer()){
    const f = [...document.querySelectorAll(".sheet button:not([disabled]), .sheet input, .sheet textarea, .sheet summary")]; if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (ev.shiftKey && i <= 0){ ev.preventDefault(); f[f.length-1].focus(); }
    else if (!ev.shiftKey && i === f.length-1){ ev.preventDefault(); f[0].focus(); }
  }
});

render();
})();
</script>
</body>
</html>
